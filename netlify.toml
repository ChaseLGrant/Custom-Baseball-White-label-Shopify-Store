# Netlify build settings for Club Custom (Next.js 15 + Prisma).
# The Netlify Next.js runtime (@netlify/plugin-nextjs) is applied automatically.
[build]
  command = "npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Declared explicitly: sites created through the API don't get the Next.js
# runtime auto-enabled, and without it Netlify publishes the raw .next folder.
[[plugins]]
  package = "@netlify/plugin-nextjs"
